name: Firebase — distribute APK & deploy web

# On every push to main (and via the manual "Run workflow" button) this
# ships two things in parallel:
#   * distribute-android — builds a release APK and pushes it to Firebase
#     App Distribution for the "testers" group.
#   * deploy-web         — builds the Flutter web app and deploys it to
#     Firebase Hosting, giving a browser-accessible URL
#     (https://project-d9f1553a-255e-41c1-961.web.app).
# The two jobs are independent: if one fails the other still ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  distribute-android:
    name: Build APK & distribute to testers
    runs-on: ubuntu-latest
    steps:
      # An empty key is the one failure this pipeline cannot survive quietly.
      # GOOGLE_MAPS_API_KEY is read through String.fromEnvironment, so it is a
      # COMPILE-TIME constant: with no value, PlacesService.isConfigured folds to
      # a const false, every map branch becomes unreachable, and dart2js strips
      # the entire map layer out of the bundle. The build still goes green and
      # the app silently falls back to plain-text address entry. That is exactly
      # how the maps went missing from production the first time, so a missing or
      # misspelled secret has to stop the run instead.
      - name: Verify the maps key reached the runner
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY is empty. Set it under Settings -> Secrets and variables -> Actions. Without it the map layer is silently tree-shaken out of the build."
            exit 1
          fi
          echo "maps key present (${#MAPS_API_KEY} chars)"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # google-services.json is committed to the repo, so no secret is needed
      # to inject it here. The google-services Gradle plugin reads it at build.
      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          # Firebase CLI token from `firebase login:ci` (SA key creation is
          # blocked by org policy, so we authenticate with a CI token instead).
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          releaseNotes: |
            Build from ${{ github.ref_name }} @ ${{ github.sha }}
          file: build/app/outputs/flutter-apk/app-release.apk

  deploy-web:
    name: Build web & deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      # An empty key is the one failure this pipeline cannot survive quietly.
      # GOOGLE_MAPS_API_KEY is read through String.fromEnvironment, so it is a
      # COMPILE-TIME constant: with no value, PlacesService.isConfigured folds to
      # a const false, every map branch becomes unreachable, and dart2js strips
      # the entire map layer out of the bundle. The build still goes green and
      # the app silently falls back to plain-text address entry. That is exactly
      # how the maps went missing from production the first time, so a missing or
      # misspelled secret has to stop the run instead.
      - name: Verify the maps key reached the runner
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY is empty. Set it under Settings -> Secrets and variables -> Actions. Without it the map layer is silently tree-shaken out of the build."
            exit 1
          fi
          echo "maps key present (${#MAPS_API_KEY} chars)"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      # Deploy build/web to Firebase Hosting via the Firebase CLI. We pin
      # firebase-tools to a major that still accepts FIREBASE_TOKEN, since
      # SA-key auth is blocked by org policy. Requires Hosting to be enabled
      # once in the Firebase console so the default site exists.
      - name: Deploy to Firebase Hosting
        run: >-
          npx --yes firebase-tools@13 deploy
          --only hosting
          --project project-d9f1553a-255e-41c1-961
          --token "$FIREBASE_TOKEN"
          --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
